# Workflow to upload libzim release to master.download.kiwix.org

name: Upload release assets to Kiwix

on:
  # Triggers workflow when release is published
  release:
    types: [published]
  # Allows triggering the workflow manually
  workflow_dispatch:
    inputs:
      version:
        description: |
          Set the release version whose assets to upload, like v9.9.9 (must be an exisitng release).
        required: true
        default: 'v'
      # TEMPORARY (libcrypto upload failure): lets us A/B the org secret against the repo-level copy, which is
      # known to work on Linux. Remove once we know which of the two the upload is unhappy with.
      keysource:
        description: |
          Which SSH secret to authenticate with - 'org' (KIWIX_FILE_UPLOAD_SSH_KEY) or
          'repo' (JAVASCRIPTLIBZIM_FILE_UPLOAD_KEY, the pre-migration copy).
        type: choice
        options:
        - org
        - repo
        default: 'org'
        required: true

# Define top-level environment vars we can refer to below
env:
  REPOSITORY: ${{ github.repository }}
  VERSION: ${{ github.event.release.tag_name }}
  DISPATCH_VERSION: ${{ github.event.inputs.version }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  UPLOAD_SSH_KEY: ${{ secrets.KIWIX_FILE_UPLOAD_SSH_KEY }}
  # TEMPORARY (libcrypto upload failure)
  KEYSOURCE: ${{ github.event.inputs.keysource }}
  REPO_UPLOAD_SSH_KEY: ${{ secrets.JAVASCRIPTLIBZIM_FILE_UPLOAD_KEY }}

jobs:
  upload:
    name: Upload assets to server
    runs-on: windows-latest
    steps:
    # Check out the repository
    - uses: actions/checkout@v4
    - name: Find the release, get assets, and upload
      run: |
        $repository = $Env:REPOSITORY
        $version = $Env:VERSION
        if (! $version) { $version = $Env:DISPATCH_VERSION }
        if (! $version) {
          Write-Host "`n** You must set a tag version so that we can find and upload the assets! **`n" -ForegroundColor Red
          exit 1
        }
        echo "`nUsing tag: $version for version upload`n"
        $UPLOAD_SSH_KEY = $Env:UPLOAD_SSH_KEY
        # TEMPORARY (libcrypto upload failure): allow the run to fall back to the pre-migration repo secret
        if ($Env:KEYSOURCE -eq 'repo') {
          Write-Host "`n[diag] Using the repo-level secret JAVASCRIPTLIBZIM_FILE_UPLOAD_KEY`n"
          $UPLOAD_SSH_KEY = $Env:REPO_UPLOAD_SSH_KEY
        } else {
          Write-Host "`n[diag] Using the org-level secret KIWIX_FILE_UPLOAD_SSH_KEY`n"
        }
        if (! $UPLOAD_SSH_KEY) {
          Write-Warning "The SSH secret is empty!"
        }
        echo "$UPLOAD_SSH_KEY" > .\scripts\upload_ssh_key
        # TEMPORARY (libcrypto upload failure): report the shape of the key file, never its contents. The armour
        # lines are printed only if they look like armour, so key material cannot leak this way.
        $keyfile = ".\scripts\upload_ssh_key"
        $bytes = [IO.File]::ReadAllBytes($keyfile)
        $lines = @(Get-Content $keyfile)
        $crlf = 0
        for ($i = 1; $i -lt $bytes.Length; $i++) {
          if ($bytes[$i] -eq 10 -and $bytes[$i - 1] -eq 13) { $crlf++ }
        }
        $bom = ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)
        # The trailing newline leaves an empty final element, so look for the last non-empty line
        $nonEmpty = @($lines | Where-Object { $_ -ne '' })
        $first = if ($nonEmpty[0] -match '^-{3,}[A-Z0-9 ]*BEGIN') { $nonEmpty[0] } else { '<redacted: not an armour line>' }
        $last = if ($nonEmpty[-1] -match '^-{3,}[A-Z0-9 ]*END') { $nonEmpty[-1] } else { '<redacted: not an armour line>' }
        Write-Host "`n[diag] key file: bytes=$($bytes.Length) lines=$($lines.Count) crlf=$crlf bom=$bom"
        Write-Host "[diag] first line: $first"
        Write-Host "[diag] last line:  $last"
        Write-Host "[diag] local ssh/OpenSSL build:"
        & "C:\Program Files\Git\usr\bin\ssh.exe" @('-V')
        Write-Host "[diag] ssh-keygen -l (fingerprint and type; both are public information):"
        & "C:\Program Files\Git\usr\bin\ssh-keygen.exe" @('-l', '-f', $keyfile)
        # -y loads the *private* key, so this is the probe that reproduces the libcrypto error.
        # Its stdout is the derived public key, which we discard as noise; we want the stderr.
        Write-Host "[diag] ssh-keygen -y (private key parse probe):"
        & "C:\Program Files\Git\usr\bin\ssh-keygen.exe" @('-y', '-f', $keyfile) | Out-Null
        Write-Host "[diag] parse probe exit code: $LASTEXITCODE (0 means the key loaded)"
        ./scripts/Upload-KiwixRelease.ps1 -yes
